name: Weekly Blog Generator

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday 09:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate blog post
        run: python scripts/blog-generator.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/app/blog/
          git diff --staged --quiet || (git commit -m "blog: auto-generate weekly article $(date -u +%Y-%m-%d)" && git push)
